name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scg_v2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: matrix.node == 20
        run: npm audit --audit-level=high

      - name: Setup test database
        run: psql -h localhost -U postgres -d scg_v2_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: postgres

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build before the tests, not after. Worker threads can only load
      # JavaScript, so the search worker's containment test needs the compiled
      # dist/ to exist — without this it skips and the hard timeout on
      # caller-supplied regexes goes unexercised in CI.
      - name: Build
        run: npm run build

      - name: Verify package boundary
        run: npm run package:verify

      - name: Run tests
        run: npm run test:ci
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scg_v2_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          NODE_ENV: test
          SCG_API_KEYS: ""
          SCG_ALLOWED_BASE_PATHS: /tmp

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: warn
