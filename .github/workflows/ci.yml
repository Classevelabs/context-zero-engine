name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scg_v2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: matrix.node == 20
        run: npm audit --audit-level=high

      - name: Setup test database
        run: psql -h localhost -U postgres -d scg_v2_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        env:
          PGPASSWORD: postgres

      # The grammars are optionalDependencies so a platform without prebuilt
      # native binaries can still install the engine. That must not become a
      # silent way to ship without the languages we claim to parse, so on the
      # platform we build and verify on, every one of them has to load.
      - name: Verify all tree-sitter grammars loaded
        run: node scripts/verify-grammars.mjs

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build before the tests, not after. Worker threads can only load
      # JavaScript, so the search worker's containment test needs the compiled
      # dist/ to exist — without this it skips and the hard timeout on
      # caller-supplied regexes goes unexercised in CI.
      - name: Build
        run: npm run build

      - name: Verify package boundary
        run: npm run package:verify

      - name: Run tests
        run: npm run test:ci
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scg_v2_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          NODE_ENV: test
          SCG_API_KEYS: ""
          SCG_ALLOWED_BASE_PATHS: /tmp

      # README, INSTALL.md and OPERATIONS.md all name `npm run test:db` as the
      # gate that proves this engine works against a real PostgreSQL — and
      # nothing ran it. A Postgres service was already running here for the
      # jest suite, so the only thing separating a documented gate from an
      # enforced one was this step. Documentation that claims a check exists,
      # while the check never executes, is worse than no claim: it reads as
      # coverage.
      - name: Real-PostgreSQL integration test
        run: npm run test:db
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scg_v2_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          NODE_ENV: test

      # Nothing proved the thing users actually install could start. The unit
      # suites exercise modules; this boots the real stdio bridge against a
      # real database and speaks MCP to it. Because the bridge runs pending
      # migrations, recovers stale transactions and health-checks the DB
      # before it will serve, a passing handshake also proves the migration
      # path applies cleanly to a fresh database — the two things a new
      # install depends on and neither of which had a test.
      - name: MCP bridge cold-start smoke (real DB, fresh migrations)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 120 node dist/mcp-bridge/index.js > /tmp/cz-mcp.json 2>/tmp/cz-mcp.err || true

          echo "--- stderr (startup log) ---"; tail -20 /tmp/cz-mcp.err || true
          echo "--- stdout (JSON-RPC) ---";    head -c 600 /tmp/cz-mcp.json || true; echo

          grep -q '"result"' /tmp/cz-mcp.json \
            || { echo "::error::MCP bridge produced no JSON-RPC result — it did not start or did not answer"; exit 1; }
          grep -q '"protocolVersion"' /tmp/cz-mcp.json \
            || { echo "::error::initialize did not return a protocolVersion"; exit 1; }
          grep -q '"tools"' /tmp/cz-mcp.json \
            || { echo "::error::tools/list returned no tool surface"; exit 1; }
          grep -q 'DB health check passed' /tmp/cz-mcp.err \
            || { echo "::error::bridge did not report a passing DB health check at startup"; exit 1; }
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: scg_v2_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          NODE_ENV: test
          SCG_API_KEYS: ""

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: warn

  # The engine installs into Claude Desktop/Code, which people run on Windows
  # and macOS far more than on Linux — and CI only ever built it on Linux.
  # Postgres service containers are Linux-only on GitHub runners, so the full
  # suite cannot move; what can move is proof that the code compiles and its
  # DB-independent behaviour holds on the platforms users are actually on.
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # No --omit=optional here on purpose: this job exists to prove a normal
      # `npm ci` succeeds on these platforms. Grammars that cannot build are
      # skipped by npm rather than failing the install, which is the behaviour
      # a Windows user gets.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
