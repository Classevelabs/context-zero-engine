# The README tells people to install this with `docker compose up -d`, and
# until now nothing had ever run that. A documented install path that no gate
# executes is a claim, not a feature: the image can stop building, or build and
# refuse to serve, and the first person to find out is a stranger following the
# README. This runs exactly the three commands the README prints, then proves
# the server it produces actually answers.
#
# Free to run: this repository is public, so Actions minutes are not metered
# against the organisation's allowance.
name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker.example'
      - 'package.json'
      - 'package-lock.json'
      - 'db/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker.example'
      - 'package.json'
      - 'package-lock.json'
      - 'db/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-up:
    name: The README's install path serves traffic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Step one and two of the README, with throwaway credentials. The
      # compose file refuses to start when any of these is unset, so filling
      # them here is the same act the README asks a human to perform.
      - name: cp .env.docker.example .env, and set the three required values
        run: |
          cp .env.docker.example .env
          # Replace the placeholders in place, which is what the README asks a
          # human to do. Appending instead would leave two lines per key: compose
          # takes the last, but anything reading the file back gets both.
          set_var() { sed -i "s|^$1=.*|$1=$2|" .env; }
          set_var DB_PASSWORD        "$(openssl rand -hex 24)"
          set_var SCG_API_KEYS       "$(openssl rand -hex 32)"
          set_var SCG_ADMIN_API_KEYS "$(openssl rand -hex 32)"
          for k in DB_PASSWORD SCG_API_KEYS SCG_ADMIN_API_KEYS; do
            n=$(grep -c "^$k=" .env)
            [ "$n" = 1 ] || { echo "::error::$k appears $n times in .env"; exit 1; }
            grep -q "^$k=replace-with" .env && { echo "::error::$k still holds its placeholder"; exit 1; }
          done
          echo "three values set, one line each"

      - name: docker compose up -d
        run: docker compose up -d --build

      # The image declares a HEALTHCHECK, so Docker itself is the judge of
      # whether the server came up. Waiting on that rather than on a bare port
      # also proves migrations applied: the server fails fast if they do not.
      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q scg)" 2>/dev/null || echo starting)
            echo "attempt $i: $state"
            [ "$state" = healthy ] && exit 0
            [ "$state" = unhealthy ] && { echo "::error::the container went unhealthy"; exit 1; }
            sleep 5
          done
          echo "::error::the container never reported healthy"
          exit 1

      - name: The published port answers
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 http://localhost:3100/health)
          echo "GET /health -> $code"; cat /tmp/health.json; echo
          [ "$code" = "200" ] || { echo "::error::/health returned $code"; exit 1; }

      # A server that answers /health but rejects the key you just set, or
      # accepts callers who set no key at all, is broken for the person who
      # installed it — in opposite directions. Assert both. The authenticated
      # form of /ready additionally reports how many migrations are recorded,
      # so a passing call proves the exact thing that used to be broken: the
      # ledger is populated, not silently empty behind a pre-seeded schema.
      - name: Auth is enforced, the key from .env works, and migrations are recorded
        run: |
          key=$(grep '^SCG_API_KEYS=' .env | cut -d= -f2-)

          anon=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 http://localhost:3100/scg_cache_stats)
          echo "GET /scg_cache_stats with no key -> $anon"
          case "$anon" in
            401|403) ;;
            *) echo "::error::an unauthenticated caller got $anon from a protected route"; exit 1 ;;
          esac

          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 20             -H "X-API-Key: $key" http://localhost:3100/ready)
          echo "GET /ready with the key -> $code"; cat /tmp/ready.json; echo
          [ "$code" = "200" ] || { echo "::error::/ready returned $code for an authenticated caller"; exit 1; }

          migrations=$(jq -r '.migrations // 0' /tmp/ready.json)
          echo "migrations recorded: $migrations"
          [ "$migrations" -gt 0 ] 2>/dev/null || {
            echo "::error::the server reports $migrations applied migrations — either the key was refused (no migrations field) or the ledger is empty"
            exit 1; }

          # A route that reads a table, to prove the schema those migrations
          # created is actually queryable.
          code=$(curl -s -o /tmp/repos.json -w "%{http_code}" --max-time 20             -X POST -H "X-API-Key: $key" -H "Content-Type: application/json"             -d '{"limit":1}' http://localhost:3100/scg_list_repos)
          echo "POST /scg_list_repos with the key -> $code"; cat /tmp/repos.json; echo
          [ "$code" = "200" ] || { echo "::error::listing repositories returned $code"; exit 1; }

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 120

      - name: docker compose down
        if: always()
        run: docker compose down -v
