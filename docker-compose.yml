services:
  # ──────────── PostgreSQL ────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scg_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # db/schema.sql is NOT mounted into docker-entrypoint-initdb.d. It is a
      # generated dump of the migrations ("Do not hand-edit"), so seeding with
      # it created every table while leaving the migration ledger empty — the
      # server then tried to apply 001_initial_schema.sql, hit `relation
      # "repositories" already exists`, and refused to start, crash-looping on
      # a first-time `docker compose up -d`. The server's own migration runner
      # builds a fresh database, extension included, and records what it ran.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scg_v2"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────── ContextZero Server ────────────
  scg:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3100:3100"
    volumes:
      - ${SCG_REPOS_PATH:-./}:/repos
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scg_v2
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      DB_SSL_ALLOW_INSECURE_PRIVATE_NETWORK: "true"
      DB_MAX_CONNECTIONS: 20
      SCG_PORT: 3100
      SCG_HOST: 0.0.0.0
      SCG_API_KEYS: ${SCG_API_KEYS:?Set SCG_API_KEYS in .env before starting}
      SCG_ADMIN_API_KEYS: ${SCG_ADMIN_API_KEYS:?Set a distinct SCG_ADMIN_API_KEYS in .env before starting}
      SCG_ALLOWED_BASE_PATHS: ${SCG_ALLOWED_BASE_PATHS:-/repos}
      SCG_CORS_ORIGINS: ${SCG_CORS_ORIGINS:-}
      SCG_TRUST_PROXY: ${SCG_TRUST_PROXY:-false}
      SCG_MAX_FILES_PER_REPO: ${SCG_MAX_FILES_PER_REPO:-20000}
      SCG_MAX_FILE_SIZE_BYTES: ${SCG_MAX_FILE_SIZE_BYTES:-1048576}
      SCG_INGEST_WORKERS: ${SCG_INGEST_WORKERS:-4}
      SCG_PYTHON_TIMEOUT_MS: ${SCG_PYTHON_TIMEOUT_MS:-30000}
      SCG_ALLOW_UNSANDBOXED_EXECUTION: ${SCG_ALLOW_UNSANDBOXED_EXECUTION:-false}
      LOG_LEVEL: info
      NODE_ENV: production

volumes:
  pgdata:
